<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetalGPS - Web Edition</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/petal-icon.png">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-section" onclick="openPetalWebsite()">
                <img src="assets/logo-transparent.png" alt="Petal Logo" class="logo">
                <h1>PetalGPS</h1>
            </div>
            <div class="status-indicator">
                <span id="status-text">Desconectado</span>
                <div id="status-dot" class="status-dot disconnected"></div>
            </div>
        </header>

        <main class="main-content">
            <!-- GPS Information Panel -->
            <section class="gps-panel">
                <h2>Información GPS</h2>
                <div class="gps-data">
                    <div class="data-item">
                        <label>Latitud:</label>
                        <span id="latitude">--°--'--"</span>
                    </div>
                    <div class="data-item">
                        <label>Longitud:</label>
                        <span id="longitude">--°--'--"</span>
                    </div>
                    <div class="data-item">
                        <label>Velocidad:</label>
                        <span id="speed">-- km/h</span>
                    </div>
                    <div class="data-item">
                        <label>Satélites:</label>
                        <span id="satellites">--</span>
                    </div>
                </div>
                
                <div class="controls">
                    <button id="start-gps" class="btn btn-primary">Iniciar GPS</button>
                    <button id="stop-gps" class="btn btn-secondary" disabled>Detener GPS</button>
                    <button id="open-maps" class="btn btn-maps" onclick="openGoogleMaps()">Abrir Mapas</button>
                </div>
            </section>

            <!-- Bluetooth Connection Panel -->
            <section class="bluetooth-panel">
                <h2>Conexión Bluetooth</h2>
                <div class="connection-status">
                    <div class="switch-container">
                        <label class="switch">
                            <input type="checkbox" id="bluetooth-switch">
                            <span class="slider"></span>
                        </label>
                        <span>Conectar dispositivo</span>
                    </div>
                    <button id="connect-btn" class="btn btn-connect">Conectar</button>
                </div>
                
                <div class="device-info">
                    <div class="progress-bar" id="progress-bar" style="display: none;">
                        <div class="progress-fill"></div>
                    </div>
                    <div id="battery-level" class="battery-info">
                        <span>BATTERY LEVEL</span>
                        <div class="battery-display">-- %</div>
                    </div>
                </div>
            </section>

            <!-- Audio Recording Panel -->
            <section class="audio-panel">
                <h2>Grabación de Audio</h2>
                <div class="audio-controls">
                    <button id="record-btn" class="btn btn-record">🎤 Grabar</button>
                    <button id="stop-record-btn" class="btn btn-stop" disabled>⏹ Detener</button>
                </div>
                <div id="audio-status" class="audio-status">Preparado para grabar audio</div>
                <canvas id="audio-visualizer" width="300" height="100"></canvas>
            </section>

            <!-- Quick Actions -->
            <section class="quick-actions">
                <h2>Acciones Rápidas</h2>
                <div class="action-buttons">
                    <button class="btn btn-chat" onclick="openChatGPT()">💬 ChatGPT</button>
                    <button class="btn btn-website" onclick="openPetalWebsite()">🌐 Petal Web</button>
                    <button class="btn btn-settings" onclick="toggleSettings()">⚙️ Configuración</button>
                </div>
            </section>
        </main>

        <!-- Settings Panel -->
        <div id="settings-panel" class="settings-panel hidden">
            <div class="settings-content">
                <h3>Configuración</h3>
                <div class="setting-item">
                    <label>Unidades de velocidad:</label>
                    <select id="speed-units">
                        <option value="kmh">km/h</option>
                        <option value="mph">mph</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Actualización GPS (ms):</label>
                    <input type="number" id="gps-interval" value="1000" min="500" max="10000">
                </div>
                <div class="setting-item">
                    <label>Dispositivos Bluetooth preferidos:</label>
                    <input type="text" id="bt-devices" placeholder="HC-06, RIEGO2, Petal" value="HC-06, RIEGO2, Petal">
                </div>
                <button class="btn btn-primary" onclick="saveSettings()">Guardar</button>
                <button class="btn btn-secondary" onclick="toggleSettings()">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
