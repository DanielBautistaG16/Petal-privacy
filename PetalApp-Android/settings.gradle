pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    // PREFER_SETTINGS (not FAIL_ON_PROJECT_REPOS): the Kotlin/Native Gradle
    // plugin auto-registers a project-level Ivy repo to fetch the K/N compiler
    // distribution for iOS targets — FAIL_ON_PROJECT_REPOS rejects that outright.
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // Future: Additional repositories if needed
        // maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "PetalHandsfree"
include ':app'
include ':shared'