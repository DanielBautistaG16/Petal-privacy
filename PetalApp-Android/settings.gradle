pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    // PREFER_PROJECT (not FAIL_ON_PROJECT_REPOS / PREFER_SETTINGS): the
    // Kotlin/Native Gradle plugin auto-registers a project-level Ivy repo to
    // download the K/N compiler distribution for the shared module's iOS
    // targets. FAIL_ON_PROJECT_REPOS rejects it outright; PREFER_SETTINGS
    // downgrades that to a warning but still ends up ignoring the repo
    // entirely, so resolving the compiler artifact fails. PREFER_PROJECT
    // (Gradle's own default) is the mode that actually lets it resolve.
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        // Future: Additional repositories if needed
        // maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "PetalHandsfree"
include ':app'
include ':shared'